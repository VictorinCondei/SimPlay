# SimPlay configuration

# Toolpath
maxStep = 0.25

# Voxel grid
resolution = 96
stockMargin = auto

# Cutter
toolDiameter = 2.0
toolLength = auto
cutterType = FLAT_END

# Renderer
wireframe = false
movesPerFrame = 2
windowWidth = 1280
windowHeight = 720
# Toolpath colours — RGB components in the range 0.0 … 1.0
# Feed moves (G01 / G02 / G03)
toolpathFeedR  = 0.0          # default: cyan
toolpathFeedG  = 0.9
toolpathFeedB  = 0.9
# Rapid moves (G00)
toolpathRapidR = 1.0          # default: yellow
toolpathRapidG = 0.9
toolpathRapidB = 0.1
# Line width in screen pixels (minimum 0.5)
toolpathLineWidth = 1.5